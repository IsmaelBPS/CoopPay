spring.application.name=CoopPay
spring.config.import=optional:file:.env[.properties]

# Database & JPA / Flyway
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:cooppay}
spring.datasource.username=${POSTGRES_USER:cooppay}
spring.datasource.password=${POSTGRES_PASSWORD:cooppay}
spring.jpa.hibernate.ddl-auto=validate


# server
server.port = 3499


# Routes
app.routes.api-base=${API_PATH:/api/v1}


# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


# Observability / Actuator
management.endpoints.web.exposure.include=health,info,metrics
# shortcut: detalhes abertos para dev local; restringir com segurança/rede interna em produção
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}

# Tracing & Logging
management.tracing.sampling.probability=1.0
logging.level.com.ismael.CoopPay=INFO
