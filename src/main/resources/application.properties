spring.application.name=CoopPay
spring.config.import=optional:file:.env[.properties]

# Database & JPA / Flyway
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:cooppay}
spring.datasource.username=${POSTGRES_USER:cooppay}
spring.datasource.password=${POSTGRES_PASSWORD:cooppay}
spring.jpa.hibernate.ddl-auto=validate


# server
server.port = 3499


# Routes
app.routes.api-base=${API_PATH:/api/v1}


# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


# Observability / Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# shortcut: detalhes abertos para dev local; restringir com segurança/rede interna em produção
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Tracing & Logging
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${OTLP_TRACING_ENABLED:true}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.level.com.ismael.CoopPay=INFO

# Kafka Observability (propaga traceId nos headers quando producers/consumers estiverem ativos)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
